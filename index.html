<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 天 30 个一句话工具</title>
<meta name="description" content="每天用一句话让 AI 做一个不需要服务器的小工具，代码全部开源。">
<style>
  :root { --bg:#0B1020; --panel:#131A2E; --line:rgba(255,255,255,.12); --text:#F4F6FB; --muted:#A9B1C7; --accent:#F472B6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:36px; line-height:1.15; margin:0 0 12px; letter-spacing:-.02em; }
  h1 em { font-style:normal; color:var(--accent); }
  p { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; margin-bottom:32px; }
  .cell { aspect-ratio:1; border-radius:14px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-weight:700; text-decoration:none; }
  .cell.done { background:var(--accent); color:#1a0b14; border-color:transparent; }
  .item { display:block; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; color:var(--text); text-decoration:none; margin-bottom:12px; }
  .item b { color:var(--accent); margin-right:8px; }
  .item span { display:block; color:var(--muted); font-size:14px; margin-top:4px; }
  footer { margin-top:32px; color:var(--muted); font-size:14px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>30 天 30 个<em>一句话工具</em></h1>
  <p>每天一句话让 AI 做一个小工具。不要服务器，不上传文件，代码全部开源。</p>
  <div class="grid" id="grid"></div>
  <div id="list"></div>
  <footer>想要什么工具？去 <a href="https://x.com/la_licorne9">X @la_licorne9</a> 评论区点菜 · <a href="https://github.com/licorne26/30-days-30-tools">GitHub</a></footer>
</main>
<script>
  const tools = [
    { day: 1, name: '照片隐私清理器', desc: '读出照片里的 GPS、设备和拍摄时间，一键导出干净照片', path: 'day01-photo-privacy-cleaner/' },
  ];
  const grid = document.getElementById('grid');
  for (let d = 1; d <= 30; d++) {
    const t = tools.find(x => x.day === d);
    const el = document.createElement(t ? 'a' : 'div');
    el.className = 'cell' + (t ? ' done' : '');
    el.textContent = d;
    if (t) el.href = t.path;
    grid.appendChild(el);
  }
  document.getElementById('list').innerHTML = tools.map(t =>
    `<a class="item" href="${t.path}"><b>Day ${t.day}</b>${t.name}<span>${t.desc}</span></a>`).join('');
</script>
</body>
</html>
