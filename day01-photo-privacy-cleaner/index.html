<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片隐私清理器 · Photo Privacy Cleaner</title>
<meta name="description" content="在浏览器里一键删除照片里的 GPS 定位、拍摄设备等隐私信息。不上传、不联网、纯本地处理。">
<style>
  :root {
    --bg: #0B1020; --panel: #131A2E; --line: rgba(255,255,255,.12);
    --text: #F4F6FB; --muted: #A9B1C7; --accent: #F472B6; --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .badge { font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 18px; padding: 40px 16px; text-align: center;
    background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: #1B2238; }
  #drop strong { display: block; font-size: 19px; margin-bottom: 6px; }
  #drop span { color: var(--muted); font-size: 14px; }
  input[type=file] { display: none; }
  .list { margin-top: 24px; display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: start; }
  .card img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; background: #0003; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .found { margin: 8px 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #ffffff10; }
  .tag.gps { background: #F8717122; color: var(--bad); }
  .tag.dev { background: #FBBF2422; color: var(--warn); }
  .tag.clean { background: #4ADE8022; color: var(--ok); }
  .map { font-size: 13px; color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px;
    padding: 8px 14px; cursor: pointer; background: var(--accent); color: #1a0b14; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #all { margin-top: 16px; display: none; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  @media (max-width: 480px) { h1 { font-size: 27px; } .card { grid-template-columns: 64px 1fr; } .card img { width: 64px; height: 64px; } }
</style>
</head>
<body>
<main>
  <h1>你发出去的照片，<br>可能带着<em>你家的定位</em></h1>
  <p class="sub">手机拍的照片里藏着 GPS 坐标、拍摄时间和手机型号。拖进来，先看它藏了什么，再一键清干净。</p>
  <div class="badges">
    <span class="badge">不上传任何文件</span>
    <span class="badge">不需要服务器</span>
    <span class="badge">断网也能用</span>
    <span class="badge">支持 JPG / PNG / WebP</span>
  </div>

  <label id="drop" for="file">
    <strong>拖入照片，或点击选择</strong>
    <span>可以一次选多张，全部在你的浏览器里处理</span>
  </label>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple>

  <div class="list" id="list"></div>
  <div id="all" class="row"><button id="dlAll">全部下载清理后的照片</button></div>

  <footer>
    30 天 30 个一句话工具 · Day 1 · 由 AI 生成，代码开源。<br>
    原理：读取照片自带的 EXIF 信息给你看，然后把图片重新绘制成一张新图，只保留像素，所有元数据都不会被带走。
  </footer>
</main>

<script>
// ---- Minimal EXIF reader for JPEG (APP1 / TIFF IFD0, ExifIFD, GPS IFD) ----
const TAGS = { 0x010F: 'make', 0x0110: 'model', 0x0131: 'software', 0x0132: 'dateTime',
  0x9003: 'dateTaken', 0xA434: 'lensModel', 0x8825: 'gpsPointer', 0x8769: 'exifPointer' };

function readExif(buf) {
  const v = new DataView(buf);
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let off = 2;
  while (off + 4 < v.byteLength) {
    const marker = v.getUint16(off);
    const size = v.getUint16(off + 2);
    if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return parseTiff(v, off + 10);
    if ((marker & 0xFF00) !== 0xFF00) break;
    off += 2 + size;
  }
  return null;
}

function parseTiff(v, start) {
  const le = v.getUint16(start) === 0x4949;
  const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
  const out = {};
  const str = (o, n) => { let s = ''; for (let i = 0; i < n; i++) { const c = v.getUint8(o + i); if (!c) break; s += String.fromCharCode(c); } return s.trim(); };
  const rational = o => u32(o) / (u32(o + 4) || 1);

  function readIfd(ifdOff, gps) {
    const base = start + ifdOff;
    if (base + 2 > v.byteLength) return;
    const n = u16(base);
    for (let i = 0; i < n; i++) {
      const e = base + 2 + i * 12;
      if (e + 12 > v.byteLength) return;
      const tag = u16(e), type = u16(e + 2), count = u32(e + 4);
      const valOff = (type === 2 && count > 4) || (type === 5) ? start + u32(e + 8) : e + 8;
      if (gps) {
        if (tag === 1) out.latRef = String.fromCharCode(v.getUint8(e + 8));
        if (tag === 3) out.lonRef = String.fromCharCode(v.getUint8(e + 8));
        if (tag === 2 || tag === 4) {
          const d = rational(valOff), m = rational(valOff + 8), s = rational(valOff + 16);
          out[tag === 2 ? 'lat' : 'lon'] = d + m / 60 + s / 3600;
        }
        continue;
      }
      const key = TAGS[tag];
      if (!key) continue;
      if (key === 'gpsPointer') readIfd(u32(e + 8), true);
      else if (key === 'exifPointer') readIfd(u32(e + 8), false);
      else if (type === 2) out[key] = str(valOff, count);
    }
  }
  readIfd(u32(start + 4), false);
  if (out.lat != null && out.latRef === 'S') out.lat = -out.lat;
  if (out.lon != null && out.lonRef === 'W') out.lon = -out.lon;
  return out;
}

// ---- Clean by re-encoding pixels through a canvas (drops every metadata block) ----
async function clean(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  const type = file.type === 'image/png' ? 'image/png' : file.type === 'image/webp' ? 'image/webp' : 'image/jpeg';
  return new Promise(r => c.toBlob(r, type, 0.92));
}

const list = document.getElementById('list');
const results = [];

// Inside claude.ai the page must ask the viewer before saving a file; opened as a plain file, normal links work.
let saver = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(ns => { saver = ns; }).catch(() => {});
}
async function offer(e, r) {
  if (!saver) return; // plain browser: let the <a download> link work
  e.preventDefault();
  try { await saver.save({ filename: r.name, data: r.blob }); }
  catch (err) { if (err && err.code === 'rate_limited') setTimeout(() => offer(e, r), 1500); }
}
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function handle(files) {
  for (const file of files) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) continue;
    const info = readExif(await file.arrayBuffer()) || {};
    const cleaned = await clean(file);
    const name = file.name.replace(/(\.\w+)?$/, '-clean$1');
    const url = URL.createObjectURL(cleaned);
    const entry = { name, url, blob: cleaned };
    results.push(entry);

    const tags = [];
    if (info.lat != null) tags.push(`<span class="tag gps">GPS 定位</span>`);
    const device = [info.make, info.model].filter(Boolean).join(' ');
    if (device) tags.push(`<span class="tag dev">设备：${esc(device)}</span>`);
    if (info.dateTaken || info.dateTime) tags.push(`<span class="tag dev">拍摄时间：${esc(info.dateTaken || info.dateTime)}</span>`);
    if (info.software) tags.push(`<span class="tag dev">软件：${esc(info.software)}</span>`);
    if (!tags.length) tags.push(`<span class="tag clean">没发现隐私信息</span>`);
    const map = info.lat != null
      ? `<div class="map">这张照片暴露了拍摄地点：${info.lat.toFixed(5)}, ${info.lon.toFixed(5)}</div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<img src="${url}" alt="">
      <div>
        <div class="name">${esc(file.name)}</div>
        <div class="meta">${kb(file.size)} → 清理后 ${kb(cleaned.size)}</div>
        <div class="found">${tags.join('')}</div>${map}
        <div class="row" style="margin-top:10px">
          <a class="btn" href="${url}" download="${esc(name)}">下载干净的照片</a>
          ${info.lat != null ? `<a class="btn ghost" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${info.lat}&mlon=${info.lon}#map=16/${info.lat}/${info.lon}">在地图上看看</a>` : ''}
        </div>
      </div>`;
    card.querySelector('a.btn[download]').addEventListener('click', e => offer(e, entry));
    list.prepend(card);
  }
  document.getElementById('all').style.display = results.length > 1 ? 'flex' : 'none';
}

const drop = document.getElementById('drop');
const input = document.getElementById('file');
input.addEventListener('change', e => handle(e.target.files));
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));
document.getElementById('dlAll').addEventListener('click', async () => {
  for (const r of results) {
    if (saver) {
      try { await saver.save({ filename: r.name, data: r.blob }); }
      catch (err) { if (err && err.code === 'declined') break; }
    } else {
      const a = document.createElement('a'); a.href = r.url; a.download = r.name; a.click();
      await new Promise(res => setTimeout(res, 300));
    }
  }
});
</script>
</body>
</html>
